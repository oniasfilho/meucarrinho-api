services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meucarrinho
      POSTGRES_USER: meucarrinho
      POSTGRES_PASSWORD: meucarrinho
    ports:
      - "5432:5432"
    volumes:
      - meucarrinho-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meucarrinho -d meucarrinho"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
    volumes:
      - "./local/localstack/ready.d:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://meucarrinho-media"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  meucarrinho-postgres:

