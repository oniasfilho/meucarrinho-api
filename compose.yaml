# Local stack from spec §14. Session 1 uses none of it: `make test` runs with Docker stopped.
# Every value here is a fixed, non-secret local default.
services:
  api:
    profiles: [full]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: carrinho
      POSTGRES_USER: carrinho
      # Local only: no password to commit, and the port is bound to this machine.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "carrinho", "-d", "carrinho"]
      interval: 2s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: carrinho
      MINIO_ROOT_PASSWORD: carrinho-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 carrinho carrinho-local &&
        mc mb --ignore-existing local/photos &&
        mc anonymous set none local/photos

  otel-lgtm:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  mock-oauth2:
    profiles: [offline]
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: 8090
    ports:
      - "8090:8090"

volumes:
  postgres-data:
  minio-data:
