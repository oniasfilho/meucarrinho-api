spring:
  application:
    name: meucarrinho-api
  datasource:
    # CARRINHO_-prefixed so a generic DATABASE_URL from another project cannot leak in.
    url: ${CARRINHO_DATABASE_URL:jdbc:postgresql://localhost:5432/carrinho}
    username: ${CARRINHO_DATABASE_USER:carrinho}
    password: ${CARRINHO_DATABASE_PASSWORD:}
  flyway:
    enabled: true
  data:
    redis:
      # Valkey from compose.yaml (spec §14); idempotency keys live here first (ADR 0010).
      url: ${CARRINHO_REDIS_URL:redis://localhost:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          # mock-oauth2 from compose.yaml locally (spec §14); the Auth0 tenant in staging and prod.
          issuer-uri: ${CARRINHO_AUTH_ISSUER_URI:http://localhost:8090/default}
          audiences: ${CARRINHO_AUTH_AUDIENCE:carrinho-api}
  aop:
    proxy-target-class: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

springdoc:
  swagger-ui:
    # The quick start opens http://localhost:8080/swagger-ui (spec §14).
    path: /swagger-ui

carrinho:
  adapters:
    persistence: postgres
    idempotency: redis-postgres   # redis | postgres | redis-postgres (Redis, PostgreSQL when Redis is down)
