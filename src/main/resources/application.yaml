spring:
  application:
    name: meucarrinho-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/carrinho}
    username: ${DATABASE_USER:carrinho}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  data:
    redis:
      # Valkey from compose.yaml (spec §14); idempotency keys live here first (ADR 0010).
      url: ${REDIS_URL:redis://localhost:6379}
  aop:
    proxy-target-class: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

springdoc:
  swagger-ui:
    # The quick start opens http://localhost:8080/swagger-ui (spec §14).
    path: /swagger-ui

carrinho:
  adapters:
    persistence: postgres
    idempotency: redis-postgres   # redis | postgres | redis-postgres (Redis, PostgreSQL when Redis is down)
