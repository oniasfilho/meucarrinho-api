spring:
  application:
    name: meucarrinho-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meucarrinho}
    username: ${DB_USERNAME:meucarrinho}
    password: ${DB_PASSWORD:meucarrinho}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  error:
    include-message: never

app:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:4566}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:meucarrinho-media}
      access-key: ${S3_ACCESS_KEY:test}
      secret-key: ${S3_SECRET_KEY:test}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      presign-ttl: ${S3_PRESIGN_TTL:15m}
      auto-create-bucket: ${S3_AUTO_CREATE_BUCKET:true}

